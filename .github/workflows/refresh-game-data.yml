name: Refresh game data

# Started by /refresh-game-data on Altare (workflow_dispatch), or by hand in Actions.
# Rebuilds songs.json / mapping.json / songs_index / locale, commits, and pushes to
# main so Deploy Altare picks up the catalog. Does not upload jackets (output/ stays
# gitignored); run a full local pack when new song art must land on the server.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Download catalog and commit index
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests UnityPy pycryptodome

      - name: Download and export catalog (no jackets)
        run: |
          set -euo pipefail
          python tools/pipelines/Riz_bundle.py \
            --download \
            --rename \
            --export-charts \
            --skip-illustrations \
            --export-levels \
            --export-achievements \
            --export-bios
          python tools/build_songs_index.py
          test -f bot/static/songs_index.json
          test -f songs.json

      - name: Commit and push catalog updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- songs.json mapping.json bot/static/songs_index.json locale
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "Refresh Rizline song catalog from game data."
          git push origin HEAD:main
